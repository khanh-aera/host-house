function render(){document.querySelectorAll("nav button").forEach((b,i)=>b.classList.toggle("active",i===1?page==="admin":page!=="admin"));const a=active();if(page==='landing'){v.innerHTML=`<section class="hero">${brand()}<p class="openstatus" style="${s.open?'':'background:#f8dce7;color:#83465c'}">${status()}</p><div class="currentlabel">STT HIỆN TẠI</div><div class="currentnum">${a?'#'+fmt(a.id):'—'}</div><div class="landingstats"><div><span>Số lượt đang chờ</span><b>${String(total()).padStart(2,'0')}</b><small>Waiting sessions</small></div><div><span>Chờ dự kiến</span><b>${total()*10} <em>phút</em></b><small>Estimated wait</small></div></div>${art()}<button class="start" onclick="go('register')" ${s.open?'':'disabled'}>tap to start</button><p class="hint">CHẠM ĐỂ BỐC SỐ</p></section>`;return}let c='';if(page==='register')c=`<h2>take your number</h2><div class="center reglabel">Bạn muốn chụp bao nhiêu lượt?<span class="en">How many sessions?</span></div><div class="qtyrow"><button onclick="change(-1)">−</button><b id="qty">${qty}</b><button onclick="change(1)">+</button></div><label for="phone">Số điện thoại</label><input id="phone" type="tel" inputmode="tel" placeholder="09xx xxx xxx"><button class="primary" onclick="book()" ${s.open?'':'disabled'}>LẤY SỐ THỨ TỰ →<span class="en">Get your number</span></button><p id="msg" role="status"></p>`;if(page==='ticket'&&mine){let t=mine,n=t.status==='waiting'?s.q.filter(q=>q.day===t.day&&q.id<t.id&&q.status==='waiting').reduce((x,q)=>x+q.left,0):0;c=`<h2>your little ticket</h2><div class="card center ticket-card">SỐ THỨ TỰ<div class="num">#${fmt(t.id)}</div>${labels[t.status]}<div class="stats"><div class="card">Lượt đăng ký<b>${t.n}</b></div><div class="card">Lượt phía trước<b>${n}</b></div></div><p>Giờ bốc số: ${time(t.at)}</p>${t.status==='waiting'?`<div class="card" style="background:#f5ebae">Chờ thêm dự kiến<h2>${n*10} phút</h2></div>`:''}<p>Đang phục vụ: ${a?'#'+fmt(a.id):'—'}</p><button onclick="copyTicket()">Sao chép link vé</button><p id="msg"></p></div>`}if(page==='admin'){c=`<h2>queue management</h2><div class="row">${status()}<button onclick="act('toggle')">${s.open?'Đóng cửa':'Mở cửa'}</button></div><div class="row"><button onclick="setTab('queue')">Hàng chờ</button><button onclick="setTab('history')">Lịch sử</button><button onclick="setTab('settings')">Cài đặt</button></div>`;if(tab==='queue')c+=`<div class="stats"><div class="card">Lượt chờ<b>${total()}</b></div><div class="card">Hoàn thành<b>${today().reduce((x,t)=>x+t.n-t.left,0)}</b></div></div><div class="card center" style="background:#f5ebae">ĐANG PHỤC VỤ<div class="num">${a?'#'+fmt(a.id):'—'}</div>${a?`${a.left}/${a.n} lượt · ${labels[a.status]}<p>${time(a.at)}</p><button onclick="act('${a.status==='called'?'shoot':'done'}')">${a.status==='called'?'Bắt đầu chụp':'Hoàn thành 1 lượt'}</button> <button onclick="act('skip')">Bỏ qua</button>`:`<button onclick="act('next')" ${waiting().length?'':'disabled'}>Gọi số tiếp theo</button>`}</div><h3>Hàng chờ tiếp theo</h3>${waiting().map(t=>`<div class="card"><div class="row"><b>#${fmt(t.id)}</b><b>${t.n} lượt</b></div><p class="hint">${time(t.at)} · Đang chờ</p><button onclick="edit(${t.id},-1)">−</button> <button onclick="edit(${t.id},1)">+</button> <button onclick="edit(${t.id},0)">Hủy số</button></div>`).join('')}`;if(tab==='history')c+=s.q.slice().reverse().map(t=>`<div class="card">#${fmt(t.id)} · ${t.n} lượt<p>${labels[t.status]} · ${time(t.at)} · Ngày demo ${t.day+1}</p></div>`).join('');if(tab==='settings')c+=`<div class="card">Múi giờ Việt Nam · GMT+7<p>Ngày mới bắt đầu #001, giữ lịch sử.</p><button onclick="act('newday')" ${s.open||remaining()?'disabled':''}>Mô phỏng ngày mới</button><p class="hint">Đóng cửa và xử lý hết vé trước khi reset.</p></div>`}v.innerHTML=`<section>${head()}${c}<p class="center"><button class="link" onclick="go('landing')">← Trang chủ</button></p><p class="hint center">A little moment by the sea.</p></section>`}
function change(d){qty=Math.max(1,Math.min(20,qty+d));document.querySelector('#qty').textContent=qty}function book(){if(!s.open)return;let p=document.querySelector('#phone').value.replace(/\s/g,'');if(!/^0\d{9}$/.test(p)){document.querySelector('#msg').textContent='Nhập số giả 10 chữ số';return}mine=today().find(t=>t.phone===p&&['waiting','called','shooting'].includes(t.status));if(!mine){mine={id:++s.seq,n:qty,left:qty,phone:p,at:Date.now(),day:s.day,status:'waiting',token:Math.random().toString(36).slice(2)};s.q.push(mine)}save();go('ticket')}async function copyTicket(){let url=location.href.split('#')[0]+'#ticket='+mine.token;try{await navigator.clipboard.writeText(url);document.querySelector('#msg').textContent='Đã sao chép link (chỉ hoạt động với dữ liệu demo trên trình duyệt này)'}catch(e){document.querySelector('#msg').textContent=url}}function setTab(t){tab=t;render()}function act(k){let a=active();if(k==='toggle')s.open=!s.open;if(k==='next'&&!a&&waiting().length)waiting()[0].status='called';if(k==='shoot'&&a)a.status='shooting';if(k==='done'&&a&&a.status==='shooting'){if(--a.left===0)a.status='done'}if(k==='skip'&&a)a.status='skipped';if(k==='newday'&&!s.open&&!remaining()){s.day++;s.seq=0;s.open=true;tab='queue'}save();render()}function edit(id,d){let t=waiting().find(t=>t.id===id);if(!t)return;if(!d){if(confirm('Hủy vé này?'))t.status='cancelled'}else if(t.n+d>=1&&t.n+d<=20){t.n+=d;t.left+=d}save();render()}window.addEventListener('storage',e=>{if(e.key===key&&e.newValue){let token=mine?.token;s=JSON.parse(e.newValue);if(token)mine=s.q.find(t=>t.token===token);if(page!=='register')render()}});if(location.hash.startsWith('#ticket=')){mine=s.q.find(t=>t.token===location.hash.slice(8));if(mine)page='ticket'}render();setInterval(()=>document.querySelectorAll('.clock').forEach(e=>e.textContent=time(Date.now())),1000);
</script></html>

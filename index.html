<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOST HOUSE</title><style>
*{box-sizing:border-box}body{margin:0;background:#e5e3dc;color:#171713;font:15px Arial}main{max-width:480px;margin:auto;min-height:100dvh;background:#f8f7f2}section{padding:24px;min-height:90dvh}header{text-align:center;font:clamp(32px,10vw,52px) Georgia;letter-spacing:-2px}small{display:block;font:9px Arial;letter-spacing:1px;border-top:1px solid;padding:8px 0;margin-top:8px}h2{font:italic 29px Georgia;text-align:center}button,input{font:inherit;padding:13px;border:1px solid #111;border-radius:12px;background:white;color:#111;min-height:46px}button{cursor:pointer}button:disabled{opacity:.4}input{width:100%;margin:10px 0}.primary{background:#f5ebae;width:100%;font-weight:bold}.center{text-align:center}.num{font:76px Georgia;line-height:1.1}.card{border:1px solid #aaa;border-radius:12px;padding:15px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.hint{font-size:12px;color:#555}.hero{background:#b5cdd9;text-align:center;padding-top:40px}.hero header{color:#fff0b9}.start{width:210px;height:60px;font:italic 29px Georgia;background:white;border:1.5px solid black}.art{width:calc(100% + 48px);margin:0 -24px}.guest{animation:walk 12s linear infinite}.curtain{transform-origin:250px 100px;animation:curt 12s infinite}.flash{animation:flash 12s infinite}.strip{animation:strip 12s infinite}.bob{animation:bob 1s alternate infinite ease-in-out}@keyframes walk{0%{transform:translateX(-90px)}25%{transform:translateX(100px);opacity:1}30%,65%{transform:translateX(100px);opacity:0}70%{transform:translateX(100px);opacity:1}100%{transform:translateX(310px)}}@keyframes curt{0%,20%,35%,60%,80%,100%{transform:scaleX(1)}27%,70%{transform:scaleX(.15)}}@keyframes flash{0%,40%,45%,50%,55%,100%{opacity:0}42%,52%{opacity:.65}}@keyframes strip{0%,65%{opacity:0}70%,100%{opacity:1}}@keyframes bob{to{transform:translateY(-2px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}nav{display:flex;justify-content:center;gap:8px;padding:10px;background:#e5e3dc}nav button{font-size:11px;min-height:36px;padding:8px 20px}.link{border:0;background:none;text-decoration:underline}.en{font-size:11px;color:#666;display:block;margin:5px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{text-align:center}.stats b{display:block;font:36px Georgia}.closed .guest,.closed .curtain,.closed .flash{animation:none}.closed .guest,.closed .flash{display:none}

.hero{padding-top:24px;padding-bottom:18px;min-height:calc(100dvh - 56px)}.hero header{color:#263e48}.openstatus{font-size:12px;margin:18px 0 12px}.currentlabel{font-size:12px;font-weight:bold;letter-spacing:1px}.currentnum{font:72px/1.05 Georgia;margin:5px 0 15px}.landingstats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.landingstats>div{background:#f8f7f2;border:1px solid #222;border-radius:12px;padding:12px 4px}.landingstats>div+div{background:#f5ebae}.landingstats span{font-size:12px}.landingstats b{display:block;font:38px/1.15 Georgia;margin:6px 0}.landingstats em{font:14px Arial}.landingstats small{border:0;padding:0;margin:0;letter-spacing:0;color:#555}.hero .art{display:block;max-height:290px;margin-top:4px;margin-bottom:8px}.qtyrow{display:flex;align-items:center;justify-content:center;gap:32px;margin:25px 0 40px}.qtyrow b{font:42px Georgia}.qtyrow button{width:48px;font-size:24px}.reglabel{margin-top:35px;font-weight:bold}.primary .en{margin-bottom:0}.hero .hint{margin:10px 0}
</style><main><nav><button onclick="go('landing')">CUSTOMER</button><button onclick="go('admin')">ADMIN · DEMO</button></nav><div id="view"></div></main><script>
const key='hosthouse-demo-v11';const now=Date.now();let s;try{s=JSON.parse(localStorage.getItem(key))}catch(e){};s=s||{open:true,day:0,seq:3,q:[{id:1,n:1,left:1,status:'shooting',at:now-600000,day:0},{id:2,n:2,left:2,status:'waiting',at:now-300000,day:0},{id:3,n:3,left:3,status:'waiting',at:now-120000,day:0}]};let page='landing',qty=1,mine=null,tab='queue';const v=document.querySelector('#view'),fmt=n=>String(n).padStart(3,'0'),time=t=>new Date(t).toLocaleTimeString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',minute:'2-digit'}),today=()=>s.q.filter(t=>t.day===s.day),waiting=()=>today().filter(t=>t.status==='waiting'),active=()=>today().find(t=>['called','shooting'].includes(t.status)),total=()=>waiting().reduce((a,t)=>a+t.left,0),remaining=()=>total()+(active()?.left||0),labels={waiting:'Đang chờ',called:'Đến lượt bạn',shooting:'Đang chụp',done:'Hoàn thành',skipped:'Bỏ qua',cancelled:'Đã hủy'};function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}function go(p){page=p;render()}function brand(){return '<header>HOST HOUSE<small>PHOTOBOOTH & SOUVENIRS · NHA TRANG</small></header>'}function head(){return `<div class="row hint"><span>${new Date().toLocaleDateString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'})}</span><span class="clock">${time(Date.now())}</span></div>${brand()}`}function status(){return s.open?'● Đang nhận khách':'● Tạm đóng'}
function art(){return `<svg class="art ${s.open?'':'closed'}" viewBox="0 0 390 300"><defs><g id="person"><ellipse cy="48" rx="15" ry="4" fill="#bba98a"/><path d="M-5 26L-8 45M5 26L9 45" stroke="#50473f" stroke-width="5" stroke-linecap="round"/><path d="M-10 5Q0 1 10 5L13 29H-13Z" fill="currentColor" stroke="#64564a"/><circle cy="-8" r="14" fill="#efc5a5"/><path d="M-14 -8Q-20 -29 0 -27Q17 -27 14 -8L7 -18L-6 -15Z" fill="#665043"/><circle cx="2" cy="-8" r="1.2"/><circle cx="8" cy="-8" r="1.2"/><path d="M2 -2q4 4 8 0" fill="none" stroke="#665043"/><circle cx="-4" cy="-1" r="3" fill="#d99483"/></g></defs><g fill="#f5f1e4"><path d="M12 45Q8 30 28 30Q38 12 53 29Q72 21 82 45Z"/><path d="M300 37Q292 22 312 21Q324 5 339 22Q360 20 362 37Z"/></g><path d="M0 135H390V300H0Z" fill="#83acba"/><path d="M0 155Q100 145 200 155T390 155M0 178Q100 170 200 178T390 178" stroke="#e7ece2" stroke-width="2" fill="none"/><path d="M0 205Q100 187 200 205T390 200V300H0Z" fill="#e8d9b8"/><path d="M0 205Q100 187 200 205T390 200" stroke="#fff5df" stroke-width="4" fill="none"/><ellipse cx="223" cy="266" rx="83" ry="9" fill="#c2ae8b"/><g stroke="#624a35"><path d="M175 62L197 48H284L263 62Z" fill="#d3aa7b"/><path d="M263 62L284 48V248L263 264Z" fill="#96704c"/><rect x="175" y="62" width="88" height="202" fill="#b88c60"/><path d="M180 67V260M185 67V260M257 67V260M273 62V250" stroke="#98724f"/><rect x="181" y="73" width="76" height="28" fill="white"/><text x="219" y="85" font-family="Georgia" font-size="9" font-weight="bold" fill="#a13b30" stroke="none" text-anchor="middle">HOST HOUSE</text><text x="219" y="94" font-size="6" fill="#a13b30" stroke="none" text-anchor="middle">PHOTOBOOTH</text><rect x="187" y="109" width="64" height="147" fill="#363e30"/><g class="curtain"><rect x="187" y="109" width="64" height="141" fill="#66724c"/><path d="M195 110V245M208 110V245M221 110V245M234 110V245M246 110V245" stroke="#414e35" stroke-width="2"/></g><rect class="flash" x="188" y="110" width="62" height="145" fill="#fff9df" stroke="none"/></g>${Array.from({length:Math.min(total(),5)},(_,i)=>`<g transform="translate(${153-i*28} 220) scale(.72)" color="${['#f5ebae','#a9b8a0','#c48c80','#e9e4d5','#92adba'][i]}"><g class="bob"><use href="#person"/></g></g>`).join('')}${total()>5?`<text x="12" y="185" font-size="13">+${total()-5}</text>`:''}<g class="guest"><g transform="translate(118 214)" color="#f5ebae"><use href="#person"/><g class="strip" transform="translate(13 10)"><rect width="10" height="25" fill="white" stroke="#555"/><path d="M2 3H8V8H2ZM2 10H8V15H2ZM2 17H8V22H2Z" fill="#8ba9b6"/></g></g></g></svg>`}
function render(){const a=active();if(page==='landing'){v.innerHTML=`<section class="hero">${brand()}<p class="openstatus">${status()}</p><div class="currentlabel">STT HIỆN TẠI</div><div class="currentnum">${a?'#'+fmt(a.id):'—'}</div><div class="landingstats"><div><span>Số lượt đang chờ</span><b>${String(total()).padStart(2,'0')}</b><small>Waiting sessions</small></div><div><span>Chờ dự kiến</span><b>${total()*10} <em>phút</em></b><small>Estimated wait</small></div></div>${art()}<button class="start" onclick="go('register')" ${s.open?'':'disabled'}>tap to start</button><p class="hint">CHẠM ĐỂ BỐC SỐ</p></section>`;return}let c='';if(page==='register')c=`<h2>take your number</h2><div class="center reglabel">Bạn muốn chụp bao nhiêu lượt?<span class="en">How many sessions?</span></div><div class="qtyrow"><button onclick="change(-1)">−</button><b id="qty">${qty}</b><button onclick="change(1)">+</button></div><label for="phone">Số điện thoại</label><input id="phone" type="tel" inputmode="tel" placeholder="09xx xxx xxx"><button class="primary" onclick="book()" ${s.open?'':'disabled'}>LẤY SỐ THỨ TỰ →<span class="en">Get your number</span></button><p id="msg" role="status"></p>`;if(page==='ticket'&&mine){let t=mine,n=t.status==='waiting'?s.q.filter(q=>q.day===t.day&&q.id<t.id&&q.status==='waiting').reduce((x,q)=>x+q.left,0):0;c=`<h2>your little ticket</h2><div class="card center">SỐ THỨ TỰ<div class="num">#${fmt(t.id)}</div>${labels[t.status]}<div class="stats"><div class="card">Lượt đăng ký<b>${t.n}</b></div><div class="card">Lượt phía trước<b>${n}</b></div></div><p>Giờ bốc số: ${time(t.at)}</p>${t.status==='waiting'?`<div class="card" style="background:#f5ebae">Chờ thêm dự kiến<h2>${n*10} phút</h2></div>`:''}<p>Đang phục vụ: ${a?'#'+fmt(a.id):'—'}</p><button onclick="copyTicket()">Sao chép link vé</button><p id="msg"></p></div>`}if(page==='admin'){c=`<h2>queue management</h2><div class="row">${status()}<button onclick="act('toggle')">${s.open?'Đóng cửa':'Mở cửa'}</button></div><div class="row"><button onclick="setTab('queue')">Hàng chờ</button><button onclick="setTab('history')">Lịch sử</button><button onclick="setTab('settings')">Cài đặt</button></div>`;if(tab==='queue')c+=`<div class="stats"><div class="card">Lượt chờ<b>${total()}</b></div><div class="card">Hoàn thành<b>${today().reduce((x,t)=>x+t.n-t.left,0)}</b></div></div><div class="card center" style="background:#f5ebae">ĐANG PHỤC VỤ<div class="num">${a?'#'+fmt(a.id):'—'}</div>${a?`${a.left}/${a.n} lượt · ${labels[a.status]}<p>${time(a.at)}</p><button onclick="act('${a.status==='called'?'shoot':'done'}')">${a.status==='called'?'Bắt đầu chụp':'Hoàn thành 1 lượt'}</button> <button onclick="act('skip')">Bỏ qua</button>`:`<button onclick="act('next')" ${waiting().length?'':'disabled'}>Gọi số tiếp theo</button>`}</div><h3>Hàng chờ tiếp theo</h3>${waiting().map(t=>`<div class="card"><div class="row"><b>#${fmt(t.id)}</b><b>${t.n} lượt</b></div><p class="hint">${time(t.at)} · Đang chờ</p><button onclick="edit(${t.id},-1)">−</button> <button onclick="edit(${t.id},1)">+</button> <button onclick="edit(${t.id},0)">Hủy số</button></div>`).join('')}`;if(tab==='history')c+=s.q.slice().reverse().map(t=>`<div class="card">#${fmt(t.id)} · ${t.n} lượt<p>${labels[t.status]} · ${time(t.at)} · Ngày demo ${t.day+1}</p></div>`).join('');if(tab==='settings')c+=`<div class="card">Múi giờ Việt Nam · GMT+7<p>Ngày mới bắt đầu #001, giữ lịch sử.</p><button onclick="act('newday')" ${s.open||remaining()?'disabled':''}>Mô phỏng ngày mới</button><p class="hint">Đóng cửa và xử lý hết vé trước khi reset.</p></div>`}v.innerHTML=`<section>${head()}${c}<p class="center"><button class="link" onclick="go('landing')">← Trang chủ</button></p><p class="hint center">A little moment by the sea.</p></section>`}
function change(d){qty=Math.max(1,Math.min(20,qty+d));document.querySelector('#qty').textContent=qty}function book(){if(!s.open)return;let p=document.querySelector('#phone').value.replace(/\s/g,'');if(!/^0\d{9}$/.test(p)){document.querySelector('#msg').textContent='Nhập số giả 10 chữ số';return}mine=today().find(t=>t.phone===p&&['waiting','called','shooting'].includes(t.status));if(!mine){mine={id:++s.seq,n:qty,left:qty,phone:p,at:Date.now(),day:s.day,status:'waiting',token:Math.random().toString(36).slice(2)};s.q.push(mine)}save();go('ticket')}async function copyTicket(){let url=location.href.split('#')[0]+'#ticket='+mine.token;try{await navigator.clipboard.writeText(url);document.querySelector('#msg').textContent='Đã sao chép link (chỉ hoạt động với dữ liệu demo trên trình duyệt này)'}catch(e){document.querySelector('#msg').textContent=url}}function setTab(t){tab=t;render()}function act(k){let a=active();if(k==='toggle')s.open=!s.open;if(k==='next'&&!a&&waiting().length)waiting()[0].status='called';if(k==='shoot'&&a)a.status='shooting';if(k==='done'&&a&&a.status==='shooting'){if(--a.left===0)a.status='done'}if(k==='skip'&&a)a.status='skipped';if(k==='newday'&&!s.open&&!remaining()){s.day++;s.seq=0;s.open=true;tab='queue'}save();render()}function edit(id,d){let t=waiting().find(t=>t.id===id);if(!t)return;if(!d){if(confirm('Hủy vé này?'))t.status='cancelled'}else if(t.n+d>=1&&t.n+d<=20){t.n+=d;t.left+=d}save();render()}window.addEventListener('storage',e=>{if(e.key===key&&e.newValue){let token=mine?.token;s=JSON.parse(e.newValue);if(token)mine=s.q.find(t=>t.token===token);if(page!=='register')render()}});if(location.hash.startsWith('#ticket=')){mine=s.q.find(t=>t.token===location.hash.slice(8));if(mine)page='ticket'}render();setInterval(()=>document.querySelectorAll('.clock').forEach(e=>e.textContent=time(Date.now())),1000);
</script></html>
